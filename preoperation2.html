<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重機点検表アプリ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f6f8; color: #333; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: #1a365d; }
        
        .info-section { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #edf2f7; }
        .info-group { flex: 1; min-width: 200px; }
        .info-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568; }
        .info-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; }
        
        .wizard-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .progress-bar { font-size: 0.9rem; color: #718096; margin-bottom: 10px; font-weight: bold; }
        .question-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: #2d3748; min-height: 3rem; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-option { padding: 15px 10px; font-size: 1.1rem; font-weight: bold; border: 2px solid #cbd5e0; border-radius: 8px; background: #fff; cursor: pointer; transition: all 0.2s; }
        .btn-option:hover { border-color: #3182ce; background: #ebf8ff; }
        .btn-option.selected { border-color: #3182ce; background: #3182ce; color: #fff; }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .btn-nav { padding: 10px 20px; font-size: 0.95rem; border: none; border-radius: 6px; cursor: pointer; background: #e2e8f0; color: #4a5568; font-weight: bold; }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

        .submit-section { text-align: center; margin-bottom: 30px; }
        .btn-submit { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; color: #fff; background-color: #38a169; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #2f855a; }
        .btn-submit:disabled { background-color: #cbd5e0; cursor: not-allowed; }

        .preview-section { margin-top: 20px; }
        .preview-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #2d3748; border-left: 4px solid #3182ce; padding-left: 8px; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: #fff; min-width: 500px; }
        th, td { border: 1px solid #cbd5e0; padding: 8px 6px; text-align: center; white-space: nowrap; }
        th { background-color: #edf2f7; color: #2d3748; font-weight: bold; }
        .th-date { min-width: 65px; width: 65px; padding: 8px 2px; }
        .col-item { text-align: left; width: 40%; min-width: 150px; white-space: normal; }

        #status-msg { margin-top: 10px; font-weight: bold; text-align: center; }
        
        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            body { padding: 8px; }
            .container { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>重機日常点検表</h1>

    <div class="info-section">
        <div class="info-group">
            <label for="inspect-date">点検日</label>
            <input type="date" id="inspect-date" onchange="updatePreviewHeader()">
        </div>
        <div class="info-group">
            <label for="machine-name">重機名 / 番号</label>
            <input type="text" id="machine-name" placeholder="例: バックホウ 01" oninput="updatePreviewHeader()">
        </div>
    </div>

    <div class="wizard-card">
        <div class="progress-bar" id="progress-text">項目 1 / 5</div>
        <div class="question-title" id="question-text">読み込み中...</div>
        <div class="options-grid">
            <button class="btn-option" onclick="selectAnswer('〇')">〇 良好</button>
            <button class="btn-option" onclick="selectAnswer('点検')">点検</button>
            <button class="btn-option" onclick="selectAnswer('給油')">給油</button>
            <button class="btn-option" onclick="selectAnswer('ー')">ー 対象外</button>
        </div>
        <div class="nav-buttons">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()" disabled>前へ</button>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">次へ</button>
        </div>
    </div>

    <!-- 送信ボタンとステータス表示 -->
    <div class="submit-section">
        <button class="btn-submit" id="btn-submit" onclick="submitData()">送信する</button>
        <div id="status-msg"></div>
    </div>

    <div class="preview-section">
        <div class="preview-title">点検表プレビュー</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-item">点検項目</th>
                        <th class="th-date" id="th-date-display">日付</th>
                    </tr>
                </thead>
                <tbody id="preview-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ★ GAS（Web App）のURLを指定（ウェブアプリとしてデプロイしたURLを設定してください）
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbykf41L6fFpLUiz3Tg8CvFn9yt1I0MYMXJ70bbPe547JD8jkMZcAdshufdT6C14Tazc/exec";

    const items = [
        "エンジンオイルの量・汚れ",
        "冷却水の量",
        "燃料の量・漏れ有無",
        "油圧オイルの量・漏れ有無",
        "ライト・警報装置の作動"
    ];

    let currentIndex = 0;
    const answers = new Array(items.length).fill("");

    window.onload = () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById("inspect-date").value = `${yyyy}-${mm}-${dd}`;
        
        renderQuestion();
        renderPreviewTable();
        updatePreviewHeader();
    };

    function renderQuestion() {
        document.getElementById("progress-text").innerText = `項目 ${currentIndex + 1} / ${items.length}`;
        document.getElementById("question-text").innerText = items[currentIndex];
        
        const options = document.querySelectorAll(".btn-option");
        options.forEach(btn => {
            const val = btn.innerText.split(" ")[0];
            if (val === answers[currentIndex]) {
                btn.classList.add("selected");
            } else {
                btn.classList.remove("selected");
            }
        });

        document.getElementById("btn-prev").disabled = currentIndex === 0;
        document.getElementById("btn-next").innerText = currentIndex === items.length - 1 ? "完了" : "次へ";
    }

    function selectAnswer(val) {
        answers[currentIndex] = val;
        renderQuestion();
        renderPreviewTable();
        
        if (currentIndex < items.length - 1) {
            setTimeout(() => {
                currentIndex++;
                renderQuestion();
            }, 150);
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentIndex < items.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    function updatePreviewHeader() {
        const dateVal = document.getElementById("inspect-date").value;
        const thDate = document.getElementById("th-date-display");
        if (dateVal) {
            const parts = dateVal.split("-");
            thDate.innerText = `${parts[1]}/${parts[2]}`;
        } else {
            thDate.innerText = "日付";
        }
    }

    function renderPreviewTable() {
        const tbody = document.getElementById("preview-body");
        tbody.innerHTML = "";
        items.forEach((item, index) => {
            const tr = document.createElement("tr");
            const tdItem = document.createElement("td");
            tdItem.className = "col-item";
            tdItem.innerText = item;
            
            const tdVal = document.createElement("td");
            tdVal.innerText = answers[index] || "";
            
            tr.appendChild(tdItem);
            tr.appendChild(tdVal);
            tbody.appendChild(tr);
        });
    }

    // ★ データ送信ロジック（GAS連携）
    function submitData() {
        const date = document.getElementById("inspect-date").value;
        const machine = document.getElementById("machine-name").value;
        const statusMsg = document.getElementById("status-msg");
        const submitBtn = document.getElementById("btn-submit");

        if (!date || !machine) {
            alert("点検日と重機名を入力してください。");
            return;
        }

        const payload = {
            date: date,
            machine: machine,
            results: items.map((item, idx) => ({ item: item, result: answers[idx] }))
        };

        statusMsg.style.color = "#3182ce";
        statusMsg.innerText = "送信中...";
        submitBtn.disabled = true;

        // 1. GAS（HtmlService経由で実行されている場合）
        if (typeof google !== "undefined" && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(response => {
                    statusMsg.style.color = "#38a169";
                    statusMsg.innerText = "送信が完了しました！";
                    submitBtn.disabled = false;
                })
                .withFailureHandler(error => {
                    statusMsg.style.color = "#e53e3e";
                    statusMsg.innerText = "送信エラーが発生しました。";
                    submitBtn.disabled = false;
                })
                .saveInspectionData(payload); // GAS側の関数名
        } 
        // 2. 外部API・Web APIとしてGASにPOST送信する場合 (fetch)
        else if (GAS_WEBAPP_URL && GAS_WEBAPP_URL !== "YOUR_GAS_WEBAPP_URL_HERE") {
            fetch(GAS_WEBAPP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusMsg.style.color = "#38a169";
                statusMsg.innerText = "送信が完了しました！";
                submitBtn.disabled = false;
            })
            .catch(err => {
                statusMsg.style.color = "#e53e3e";
                statusMsg.innerText = "送信エラーが発生しました。";
                submitBtn.disabled = false;
            });
        } else {
            // テスト用表示
            setTimeout(() => {
                statusMsg.style.color = "#38a169";
                statusMsg.innerText = "[テスト] データを取得しました（連携URL未設定）";
                submitBtn.disabled = false;
                console.log("送信データ:", payload);
            }, 500);
        }
    }
</script>

</body>
</html>
